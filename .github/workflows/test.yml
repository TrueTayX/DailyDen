name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Check that dist matches the source
        run: |
          changes="$(git status --short --untracked-files=all -- dist/)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "Run npm run build and commit the updated dist/."
            exit 1
          fi
