<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Daily Den is a home for daily puzzle games. Play Lineup.Day and Unruled.">
  <meta name="theme-color" content="#f6f2e7">
  <meta property="og:title" content="Daily Den">
  <meta property="og:description" content="A home for daily puzzle games.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://dailyden.games/">
  <link rel="stylesheet" href="styles.css">
  <title>Daily Den — Daily Puzzle Games</title>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero-copy">
        <h1>Daily Den<span>.</span></h1>
        <p>A home for daily puzzle games.</p>
      </div>
      <div class="den" aria-hidden="true">
        <span class="sun"></span>
        <span class="arch arch-outer"></span>
        <span class="arch arch-middle"></span>
        <span class="arch arch-inner"></span>
        <span class="spark"></span>
        <span class="ground"></span>
      </div>
    </header>

    <section class="games" aria-labelledby="games-heading">
      <h2 id="games-heading">The games</h2>
      <ul class="game-grid">
        <li>
          <article class="game">
            <div class="game-art lineup-art" aria-hidden="true">
              <span>3</span><span>1</span><span>2</span>
            </div>
            <div class="game-copy">
              <h3>Lineup.Day</h3>
              <p>Put five things in the right order in a daily ranking puzzle.</p>
              <a class="play" href="https://lineup.day/">Play Lineup.Day <span aria-hidden="true">↗</span></a>
            </div>
          </article>
        </li>
        <li>
          <article class="game">
            <div class="game-art unruled-art" aria-hidden="true">
              <span class="rule-token"></span><span class="rule-arrow">→</span><span class="rule-token token-outline"></span>
            </div>
            <div class="game-copy">
              <h3>Unruled</h3>
              <p>Study the examples, find the hidden rule, and predict what comes next.</p>
              <a class="play" href="./unruled/">Play Unruled <span aria-hidden="true">→</span></a>
            </div>
          </article>
        </li>
      </ul>
    </section>
  </main>
  <!-- site-footer:start -->
  <!-- site-footer:end -->
</body>
</html>
